kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-app
  namespace: regionaldr-testv17
  labels:
    regionaldr: test
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ocs-storagecluster-cephfs-selinux-relabel
  volumeMode: Filesystem
